# tdf47.com Nginx 設定（設計書 9章「Nginx」）。
# 静的ファイルを配るだけ。PHP/DB/アプリサーバは無し。
#
# 配置: /etc/nginx/sites-available/tdf47.conf → sites-enabled にシンボリックリンク
# ドキュメントルート: /var/www/tdf47/dist （deploy.sh の rsync 先）
# 証明書: certbot（Let's Encrypt）で取得後、下の ssl_* を有効化。

# http → https（および www→apex）へ301
server {
    listen 80;
    listen [::]:80;
    server_name tdf47.com www.tdf47.com;
    # certbot のチャレンジだけは http で通す
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://tdf47.com$request_uri; }
}

# www.tdf47.com (https) → apex へ301
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.tdf47.com;

    ssl_certificate     /etc/letsencrypt/live/tdf47.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tdf47.com/privkey.pem;

    return 301 https://tdf47.com$request_uri;
}

# 本体（apex, https）
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tdf47.com;

    root /var/www/tdf47/dist;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/tdf47.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tdf47.com/privkey.pem;

    # アクセスログは必ず残す（GoAccess 等で月次集計、GA4 の裏取りに使用）
    access_log /var/log/nginx/tdf47.access.log;
    error_log  /var/log/nginx/tdf47.error.log;

    charset utf-8;

    # 末尾スラッシュなし → 付与して301（ディレクトリが存在する場合）
    # try_files がディレクトリを index.html で解決する。存在しなければ404。
    location = / { try_files /index.html =404; }

    location / {
        try_files $uri $uri/ =404;
    }

    # 静的アセットは長期キャッシュ
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # search-index はビルドごとに更新されるので短め
    location = /data/search-index.json {
        expires 1h;
        add_header Cache-Control "public";
    }

    # 404
    error_page 404 /404.html;
    location = /404.html { internal; }

    # セキュリティヘッダ（静的サイト向けの最小限）
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
