name: 国内からの再確認窓口を試す（手動）

# tdf47.com のサーバー上の再確認窓口（/_recheck/）が動くかを、指定したURLで試す。DBは変えない。
on:
  workflow_dispatch:
    inputs:
      urls:
        description: '確認するURL（空白区切り）'
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python 3.12 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: GitHub（海外）から直接確認したときと、国内から確認したときを比べる
        env:
          RECHECK_TOKEN: ${{ secrets.RECHECK_TOKEN }}
          URLS: ${{ github.event.inputs.urls }}
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "src")
          import probe
          for u in os.environ["URLS"].split():
              a, b = probe.fetch(u), probe.recheck_domestic(u)
              print("URL:", u)
              print("  GitHub（海外）から:", a)
              print("  国内から          :", b)
              # 結果を注記（annotation）にも出す（実行ログを開かなくても確認できるように）
              print(f"::notice title={u}::海外から {a[0]} {a[3]} ／ 国内から {b[0] if b else None} {b[3] if b else '窓口を使えなかった'}")
          PY
