name: 公式サイトから項目のページを探す（手動）

# 入札・契約／職員採用／統計／総合計画／DX推進計画のページの候補を、各団体の公式サイトから探す。
# 結果は reports/link-candidates-<日付>.csv にコミットする（DBは変えない。取り込みは別途）。
# ★クロールは手元のPCでは行わない。GitHubのクラウドで実行する。robots.txt を守り、同じサイトへは1.2秒以上あける。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'sample（規模を混ぜて n 団体）／codes（団体コード指定）／all（全団体、offset と limit で区切る）'
        required: true
        default: 'sample'
      n:
        description: 'sample のときの団体数'
        required: false
        default: '50'
      codes:
        description: 'codes のときの団体コード（カンマ区切り）'
        required: false
        default: ''
      offset:
        description: 'all のときの開始位置'
        required: false
        default: '0'
      limit:
        description: 'all のときの件数（0=最後まで）'
        required: false
        default: '400'
      kinds:
        description: '探す項目（カンマ区切り。空欄＝入札・契約〜DX推進計画の5項目。kouhou / reiki も指定できる）'
        required: false
        default: ''

concurrency:
  group: tdf47-probe   # DBやreportsのコミットが衝突しないよう、日次の確認と同じグループで直列にする
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: write
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python 3.12 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 候補を探す
        env:
          TZ: Asia/Tokyo
          MODE: ${{ github.event.inputs.mode }}
          N: ${{ github.event.inputs.n }}
          CODES: ${{ github.event.inputs.codes }}
          OFFSET: ${{ github.event.inputs.offset }}
          LIMIT: ${{ github.event.inputs.limit }}
          KINDS: ${{ github.event.inputs.kinds }}
        run: |
          K=""
          [ -n "$KINDS" ] && K="--kinds $KINDS"
          OUT="reports/link-candidates-$(date +%Y%m%d-%H%M).csv"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          case "$MODE" in
            sample) python3 src/crawl_links.py --sample "$N" --out "$OUT" $K ;;
            codes)  python3 src/crawl_links.py --codes "$CODES" --out "$OUT" $K ;;
            all)    python3 src/crawl_links.py --all --offset "$OFFSET" --limit "$LIMIT" --out "$OUT" $K ;;
            *) echo "::error::mode は sample / codes / all"; exit 1 ;;
          esac

      - name: 結果をコミット
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add "$OUT"
          git commit -m "crawl: 項目ページの候補 ($(date +%F))" && git pull --rebase && git push
